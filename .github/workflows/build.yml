name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx electron-builder --mac dmg --arm64 --x64
      - name: 校验签名
        run: |
          for app in dist/mac*/*.app; do codesign --verify --deep --verbose=2 "$app"; done
      - uses: actions/upload-artifact@v4
        with: { name: mac-dmg, path: dist/*.dmg }
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx electron-builder --win nsis portable --x64
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/*.exe }
